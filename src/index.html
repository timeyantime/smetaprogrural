<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Сметная программа — сметная программа ресурсным методом</title>
  
  <!-- Shims for older browsers -->
  <script type="module">
    // Polyfills will be added here if needed
  </script>
  
  <!-- Alpine.js from CDN -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  
  <!-- Print styles -->
  <style id="print-orientation-style">
    @media print {
      @page {
        size: A4 landscape;
        margin: 10mm;
      }
    }
  </style>
  
  <!-- Main CSS -->
  <link rel="stylesheet" href="/src/css/style.css" />
</head>
<body>
  <!-- Main App Container -->
  <div x-data="smeta()" x-init="init()" class="app">
    
    <!-- Header -->
    <header class="at-topbar">
      <div class="at-crumb">
        <span class="at-db-icon">📁</span>
        <span class="at-db-name">Сметная программа</span>
        <span class="at-sep">/</span>
        <input 
          class="at-title-input" 
          x-model="data.title" 
          placeholder="Наименование сметы" 
        />
      </div>
      <div class="at-actions">
        <!-- Save Button -->
        <button 
          class="at-btn at-btn-primary" 
          :class="{ 'is-saved': savedFlash }" 
          @click="manualSave()"
          :title="savedTimeText()"
        >
          <template x-if="!savedFlash"><span>💾 Сохранить</span></template>
          <template x-if="savedFlash"><span>✓ Сохранено</span></template>
        </button>
        
        <!-- Import/Export Buttons -->
        <button class="at-btn" @click="$refs.fileImport.click()">
          <svg viewBox="0 0 16 16" width="14" height="14"><path fill="currentColor" d="M8 1l3.5 3.5H9v6H7v-6H4.5L8 1zM2 12h12v2H2z"/></svg>
          Импорт JSON
        </button>
        <button class="at-btn" @click="exportJson()">
          <svg viewBox="0 0 16 16" width="14" height="14"><path fill="currentColor" d="M8 15L4.5 11.5H7v-6h2v6h2.5L8 15zM2 3h12V1H2z"/></svg>
          Экспорт JSON
        </button>
        <button class="at-btn" @click="exportCsv()">
          <svg viewBox="0 0 16 16" width="14" height="14"><path fill="currentColor" d="M3 1h7l3 3v11H3V1zm7 0v3h3M5 8h6M5 11h6"/></svg>
          Экспорт CSV
        </button>
        <button class="at-btn" @click="exportXls()" title="Экспорт в Excel (.xls, без интернета)">
          <svg viewBox="0 0 16 16" width="14" height="14"><path fill="currentColor" d="M2 2h12v12H2V2zm4.6 6L9.4 12h-1L7 9.8 5.6 12h-1l2.8-4L4.6 4h1L7 6.2 8.4 4h1L6.6 8z"/></svg>
          Excel
        </button>
        
        <!-- Other Action Buttons -->
        <button class="at-btn" @click="openHelpModal()" title="Как считаются затраты — справочник по методологии">
          <svg viewBox="0 0 16 16" width="14" height="14"><path fill="currentColor" d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1zm.9 10.6H7.1v-1.4h1.8v1.4zm0-2.6H7.1V4.6h1.8v4.4z"/></svg>
          Справочник
        </button>
        <button class="at-btn" @click="openNsb()" title="Нормативно-справочная база">
          <svg viewBox="0 0 16 16" width="14" height="14"><path fill="currentColor" d="M2 2h5v2H2zM9 2h5v2H9zM2 7h5v2H2zM9 7h5v2H9zM2 12h12v2H2z"/></svg>
          НСБ
        </button>
        <button class="at-btn" @click="openCalc()" title="Калькулятор трудоемкости и машинного времени">
          <svg viewBox="0 0 16 16" width="14" height="14"><path fill="currentColor" d="M4 1h8a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1zm1 2v2h6V3H5zM5 7v1.5h1.5V7H5zm2.75 0v1.5h1.5V7h-1.5zM5 10v1.5h1.5V10H5zm2.75 0v1.5h1.5V10h-1.5zM5 12.5V14h4.25v-1.5H5z"/></svg>
          Калькулятор
        </button>
        
        <span class="at-top-sep"></span>
        
        <!-- Theme and History Buttons -->
        <button 
          class="at-btn at-icon-btn" 
          :class="{ 'has-problems': problemCount() > 0 }"
          @click="historyOpen = !historyOpen" 
          title="Журнал изменений сметы"
        >
          <svg viewBox="0 0 16 16" width="14" height="14"><path fill="currentColor" d="M8 1a7 7 0 1 0 7 7h-2a5 5 0 1 1-5-5V3.5L10.5 6 8 8V1z"/></svg>
          Журнал<span class="at-badge" x-show="problemCount() > 0" x-text="problemCount()"></span>
        </button>
        <button class="at-btn at-icon-btn" @click="undoAction()" :disabled="!undoStack.length" title="Отменить (Ctrl+Z)">↩</button>
        <button class="at-btn at-icon-btn" @click="redoAction()" :disabled="!redoStack.length" title="Повторить (Ctrl+Shift+Z)">↪</button>
        <button 
          class="at-btn at-icon-btn" 
          @click="darkTheme = !darkTheme"
          :title="darkTheme ? 'Светлая тема' : 'Темная тема'" 
          x-text="darkTheme ? '☀️' : '🌙'"
        ></button>
        
        <!-- Project Settings and Print -->
        <button class="at-btn" @click="openProjectModal()" title="Реквизиты объекта — для титульного листа печати">
          <svg viewBox="0 0 16 16" width="14" height="14"><path fill="currentColor" d="M3 14V3h6v3h4v8H3zM5 5v1h2V5H5zM5 8v1h4V8H5zM5 11v1h4V11H5z"/></svg>
          Реквизиты
        </button>
        <button class="at-btn" @click="openPrintModal()">
          <svg viewBox="0 0 16 16" width="14" height="14"><path fill="currentColor" d="M4 5V1h8v4M4 12H2V6h12v6h-2M4 9h8v6H4z"/></svg>
          Печать ➤
        </button>
        
        <!-- Hidden File Inputs -->
        <input type="file" x-ref="fileImport" accept=".json" hidden @change="importJson($event)" />
      </div>
    </header>

    <!-- Tabs Navigation -->
    <nav class="at-tabs-bar">
      <div class="at-tabs">
        <button class="at-tab" :class="{ active: activeTab === null }" @click="activeTab = null">
          <span class="at-tab-icon">📋</span> Все разделы
        </button>
        <template x-for="(section, si) in data.sections" :key="section.id">
          <div 
            class="at-tab-wrap" 
            draggable="true" 
            @dragstart="tabDragFrom = si" 
            @dragover.prevent
            @drop="moveSectionByDrag(si)"
          >
            <button 
              class="at-tab" 
              :class="{ active: activeTab === si }"
              @click="selectTab(si)" 
              @dblclick="startRenameSection(si)"
            >
              <span class="at-tab-name" x-text="section.name"></span>
              <span class="at-tab-count" x-text="section.resources.length"></span>
            </button>
          </div>
        </template>
        <button class="at-tab at-tab-add" @click="sectionModalOpen = true; sectionModalMode = 'create'" title="Добавить раздел">
          <span class="at-tab-icon">+</span>
        </button>
      </div>
      <div class="at-tabs-actions">
        <button class="at-btn at-btn-small" @click="groupBy = groupBy === 'none' ? 'type' : groupBy === 'type' ? 'unit' : 'none'" title="Группировать по типу/ед.изм.">
          <template x-if="groupBy === 'none'">Группировать</template>
          <template x-if="groupBy === 'type'">По типу</template>
          <template x-if="groupBy === 'unit'">По ед.изм.</template>
        </button>
      </div>
    </nav>

    <!-- Main Content Area -->
    <main class="at-main">
      
      <!-- Table View -->
      <template x-if="viewTab === 'table'">
        <div class="at-table-container">
          <!-- Table Header -->
          <div class="at-table-header">
            <div class="at-table-row">
              <template x-for="col in columns" :key="col.key">
                <div 
                  class="at-table-cell at-table-header-cell" 
                  :style="{ width: col.width + 'px', minWidth: col.min + 'px' }"
                  :class="{ 'at-table-cell-sorted': colSorted(col.key) }"
                  @click="sortState.field === col.key ? (sortState.dir *= -1) : (sortState = { field: col.key, dir: 1 }); sortState.field = col.key"
                >
                  <span x-text="col.label"></span>
                  <template x-if="colSorted(col.key)">
                    <span x-text="sortDir()"></span>
                  </template>
                </div>
              </template>
            </div>
          </div>

          <!-- Table Body -->
          <div class="at-table-body">
            <template x-for="(item, index) in pagedRows" :key="item.row.id">
              <div 
                class="at-table-row" 
                :class="{ 'at-table-row-selected': isSelected(item.row.id) }"
                @click="selectedIds = new Set([item.row.id]); $event.stopPropagation()"
                @dblclick="expandedRow = expandedRow?.row?.id === item.row.id ? null : { si: item.si, row: item.row, index }"
              >
                <template x-for="col in columns" :key="col.key">
                  <div 
                    class="at-table-cell" 
                    :style="{ width: col.width + 'px', minWidth: col.min + 'px' }"
                    :class="col.key"
                  >
                    <template x-if="col.key === 'num'">
                      <span x-text="index + 1 + page * PAGE_SIZE"></span>
                    </template>
                    <template x-if="col.key === 'basis'">
                      <span x-text="item.row.basis"></span>
                    </template>
                    <template x-if="col.key === 'name'">
                      <span x-text="item.row.name"></span>
                    </template>
                    <template x-if="col.key === 'type'">
                      <span x-text="item.row.type === 'labor' ? 'Работа' : item.row.type === 'machine' ? 'Машина' : 'Материал'"></span>
                    </template>
                    <template x-if="col.key === 'unit'">
                      <span x-text="item.row.unit"></span>
                    </template>
                    <template x-if="col.key === 'qty'">
                      <span x-text="item.row.qty"></span>
                    </template>
                    <template x-if="col.key === 'price'">
                      <span x-text="formatMoney(item.row.price)"></span>
                    </template>
                    <template x-if="col.key === 'total'">
                      <span x-text="formatMoney(item.row.qty * item.row.price)"></span>
                    </template>
                    <template x-if="col.key === 'note'">
                      <span x-text="item.row.note"></span>
                    </template>
                    <template x-if="col.key === 'days'">
                      <span x-text="item.row.days || ''"></span>
                    </template>
                    <template x-if="col.key === 'pred'">
                      <span x-text="item.row.pred || ''"></span>
                    </template>
                    <template x-if="col.key === 'actions'">
                      <button class="at-btn-icon" @click.stop="duplicateRowById(item.si, item.row.id)" title="Дублировать">
                        <svg viewBox="0 0 16 16" width="14" height="14"><path fill="currentColor" d="M2 2h2v2H2zM5 2h2v2H5zM8 2h2v2H8zM2 5h2v2H2zM5 5h2v2H5zM8 5h2v2H8zM2 8h2v2H2zM5 8h2v2H5zM8 8h2v2H8z"/></svg>
                      </button>
                      <button class="at-btn-icon" @click.stop="removeResource(item.si, index)" title="Удалить">
                        <svg viewBox="0 0 16 16" width="14" height="14"><path fill="currentColor" d="M4 5V1h8v4M4 12H2V6h12v6h-2M4 9h8v6H4z"/></svg>
                      </button>
                    </template>
                  </div>
                </template>
              </div>
            </template>
          </div>

          <!-- Pagination -->
          <div class="at-pagination" x-show="totalPages > 1">
            <button class="at-btn" @click="page = Math.max(0, page - 1)" :disabled="page === 0">
              ← Предыдущая
            </button>
            <span class="at-pagination-info" x-text="`Стр. ${page + 1} из ${totalPages}`"></span>
            <button class="at-btn" @click="page = Math.min(totalPages - 1, page + 1)" :disabled="page >= totalPages - 1">
              Следующая →
            </button>
          </div>
        </div>
      </template>

      <!-- Gantt View (Placeholder) -->
      <template x-if="viewTab === 'gantt'">
        <div class="at-gantt-container">
          <h2>Диаграмма Ганта</h2>
          <p>В разработке...</p>
        </div>
      </template>

      <!-- Summary View (Placeholder) -->
      <template x-if="viewTab === 'summary'">
        <div class="at-summary-container">
          <h2>Сводка</h2>
          <p>В разработке...</p>
        </div>
      </template>
    </main>

    <!-- Modals -->
    
    <!-- Help Modal -->
    <div class="at-modal" x-show="helpModalOpen" @click.away="helpModalOpen = false">
      <div class="at-modal-content" @click.stop>
        <h2>Справочник</h2>
        <p>Информация о методологии расчета смет...</p>
        <button class="at-btn" @click="helpModalOpen = false">Закрыть</button>
      </div>
    </div>

    <!-- Print Modal -->
    <div class="at-modal" x-show="printModalOpen" @click.away="printModalOpen = false">
      <div class="at-modal-content at-modal-wide" @click.stop>
        <h2>Настройки печати</h2>
        <div class="at-print-settings">
          <h3>Колонки для печати</h3>
          <div class="at-checkbox-group">
            <template x-for="col in printCols()" :key="col.key">
              <label class="at-checkbox">
                <input 
                  type="checkbox" 
                  x-model="printSettings.cols" 
                  :value="col.key"
                />
                <span x-text="colLabel(col.key)"></span>
              </label>
            </template>
          </div>
        </div>
        <div class="at-modal-actions">
          <button class="at-btn" @click="printModalOpen = false">Закрыть</button>
          <button class="at-btn at-btn-primary" @click="window.print()">Печать</button>
        </div>
      </div>
    </div>

    <!-- Section Modal -->
    <div class="at-modal" x-show="sectionModalOpen" @click.away="sectionModalOpen = false">
      <div class="at-modal-content" @click.stop>
        <h2 x-text="sectionModalMode === 'create' ? 'Новый раздел' : 'Редактировать раздел'"></h2>
        <input 
          type="text" 
          x-model="sectionDraft.name" 
          placeholder="Название раздела"
          class="at-input"
        />
        <div class="at-modal-actions">
          <button class="at-btn" @click="sectionModalOpen = false">Отмена</button>
          <button 
            class="at-btn at-btn-primary" 
            @click="createSection(sectionDraft.name); sectionModalOpen = false; sectionDraft.name = ''"
            x-show="sectionModalMode === 'create'"
          >Создать</button>
        </div>
      </div>
    </div>

    <!-- NSB Modal -->
    <div class="at-modal at-modal-wide" x-show="nsbModalOpen" @click.away="nsbModalOpen = false">
      <div class="at-modal-content" @click.stop>
        <h2>Нормативно-справочная база</h2>
        <input 
          type="text" 
          x-model="nsbSearch" 
          placeholder="Поиск по НСБ..."
          class="at-input"
        />
        <div class="at-nsb-list">
          <template x-for="item in nsbItems.filter(i => i.name.toLowerCase().includes(nsbSearch.toLowerCase()))" :key="item.id">
            <div class="at-nsb-item">
              <div class="at-nsb-info">
                <span class="at-nsb-basis" x-text="item.basis"></span>
                <span class="at-nsb-name" x-text="item.name"></span>
                <span class="at-nsb-unit" x-text="item.unit"></span>
              </div>
              <div class="at-nsb-price" x-text="formatMoney(item.price)"></div>
            </div>
          </template>
        </div>
        <button class="at-btn" @click="nsbModalOpen = false">Закрыть</button>
      </div>
    </div>

    <!-- History Panel -->
    <div class="at-history-panel" x-show="historyOpen" :class="{ 'at-history-panel-open': historyOpen }">
      <h3>Журнал изменений</h3>
      <div class="at-history-list">
        <template x-for="entry in activityLog" :key="entry.time">
          <div class="at-history-entry">
            <span class="at-history-time" x-text="entry.time"></span>
            <span class="at-history-text" x-text="entry.text"></span>
          </div>
        </template>
      </div>
    </div>
  </div>

  <!-- Alpine.js store initialization -->
  <script type="module">
    import smeta from '/src/js/app.js';
    // Alpine.js automatically picks up the smeta function
  </script>

  <!-- Legacy scripts for compatibility -->
  <script src="/src/js/legacy-adapter.js"></script>
  <script src="/js/money.js"></script>
  <script src="/js/office.js"></script>
  <script src="/js/rounding.js"></script>
</body>
</html>
